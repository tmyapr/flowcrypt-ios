name: poc-record

# Stage 3: record the actual proof, driving the Simulator through the host GUI.
#
# Appium is impossible on this runner image: every Xcode (16.0 .. 26.3) is
# missing lib_TestingInterop.dylib, so WebDriverAgent cannot be built. cliclick
# and System Events do work, so the UI is driven directly (see
# poc/scripts/drive_ui.py).
#
# The app auto-fills the mail servers from the email domain:
#   poc@mockmail.test -> imap.mockmail.test:993 (TLS) / smtp.mockmail.test:465
# so /etc/hosts points those names at 127.0.0.1 and the mock servers listen on
# the default TLS ports. That keeps the number of taps small.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'run id of a successful poc-build (artifact poc-apps)'
        required: true
      runner:
        description: 'macOS runner label'
        default: 'macos-15-intel'
      phase:
        description: 'explore (screenshots only) or login (full flow)'
        default: 'explore'

env:
  POC_EMAIL: poc@mockmail.test
  POC_PASSWORD: 'PocPassw0rd!'
  OUT: ${{ github.workspace }}/poc-out

jobs:
  record:
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download built apps
        uses: actions/download-artifact@v4
        with:
          name: poc-apps
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/apps

      - name: Unpack apps
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apps"
          mkdir -p old new
          ditto -x -k old.app.zip old
          ditto -x -k new.app.zip new
          plutil -extract CFBundleIdentifier raw old/FlowCrypt.app/Info.plist
          plutil -extract CFBundleIdentifier raw new/FlowCrypt.app/Info.plist

      - name: Select Xcode
        run: |
          set -euo pipefail
          PICKED=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && PICKED="$app" && break
          done
          sudo xcode-select -s "$PICKED"
          xcodebuild -version

      - name: Tooling (Pillow, cliclick)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages Pillow || python3 -m pip install --quiet Pillow
          python3 -c "import PIL; print('pillow', PIL.__version__)"
          brew install cliclick 2>&1 | tail -2
          which cliclick

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in d.items():
              for dev in devs:
                  if "iPhone 16 Pro" in dev["name"] and dev.get("isAvailable"):
                      print(dev["udid"]); raise SystemExit
          for rt,devs in d.items():
              for dev in devs:
                  if "iPhone" in dev["name"] and dev.get("isAvailable"):
                      print(dev["udid"]); raise SystemExit
          raise SystemExit("no iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl erase "$UDID" || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "device: $(xcrun simctl list devices | grep "$UDID")"

      - name: Point the mail hostnames at localhost
        run: |
          set -euo pipefail
          echo "127.0.0.1 imap.mockmail.test smtp.mockmail.test" | sudo tee -a /etc/hosts
          tail -2 /etc/hosts
          python3 -c "import socket;print(socket.gethostbyname('imap.mockmail.test'), socket.gethostbyname('smtp.mockmail.test'))"

      - name: Trust the mock mail CA inside the simulator
        run: |
          set -euo pipefail
          bash poc/scripts/make_certs.sh "$OUT/certs"
          xcrun simctl keychain '${{ steps.sim.outputs.udid }}' add-root-cert "$OUT/certs/ca.pem"
          echo "root CA installed"

      - name: Start mock IMAP/SMTP on the default TLS ports
        run: |
          set -euo pipefail
          mkdir -p "$OUT" /tmp/mock_mail
          TLS=(--cert "$OUT/certs/server-chain.pem" --key "$OUT/certs/server.key")
          # 993/465 are privileged ports: the servers have to run as root.
          sudo mkdir -p /tmp/mock_mail
          sudo chmod 777 /tmp/mock_mail
          sudo touch /tmp/mock_mail/imap.log /tmp/mock_mail/smtp.log
          sudo chmod 666 /tmp/mock_mail/imap.log /tmp/mock_mail/smtp.log
          sudo nohup python3 -u poc/mock_mail/imap_server.py --port 993 --log /tmp/mock_mail/imap.log "${TLS[@]}" > "$OUT/mock-imap.stdout" 2>&1 &
          sudo nohup python3 -u poc/mock_mail/smtp_server.py --port 465 --log /tmp/mock_mail/smtp.log "${TLS[@]}" > "$OUT/mock-smtp.stdout" 2>&1 &
          python3 poc/scripts/wait_ports.py 993 465 --timeout=45 || { cat "$OUT"/mock-*.stdout; exit 1; }
          POC_PORT_OFFSET=0 python3 poc/scripts/assert_mail_flow.py 993 465 || {
            cat "$OUT"/mock-*.stdout; exit 1; }
          sudo chmod 666 /tmp/mock_mail/*.log

      - name: Install and launch the old build, open Simulator window
        id: launch
        run: |
          set -uo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          BID=$(plutil -extract CFBundleIdentifier raw "$RUNNER_TEMP/apps/old/FlowCrypt.app/Info.plist")
          echo "$BID" > "$OUT/bundle-id.txt"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/apps/old/FlowCrypt.app"
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 20
          xcrun simctl launch "$UDID" "$BID" || true
          sleep 12
          D="python3 poc/scripts/drive_ui.py"
          # macOS 15 raises a local-network prompt for the mock-mail process; it
          # lands on top of the Simulator window and would swallow our taps.
          $D dismiss
          sleep 2
          $D dismiss
          echo "--- dialog inventory (empty = clean) ---"
          $D dialogs
          python3 poc/scripts/drive_ui.py focus
          python3 poc/scripts/drive_ui.py geom
          # keep the window screenshot out of the artifact if calibration failed
          cp /tmp/drive_ui/desktop.png "$OUT/calibration-desktop.png" 2>/dev/null || true

      - name: Explore the sign-in and setup screens
        if: github.event.inputs.phase == 'explore'
        continue-on-error: true
        run: |
          set -uo pipefail
          D="python3 poc/scripts/drive_ui.py"
          mkdir -p "$OUT/explore"
          $D dismiss
          $D shot "$OUT/explore/00-signin.png"
          xcrun simctl io '${{ steps.sim.outputs.udid }}' screenshot "$OUT/explore/00-device.png"
          echo "--- tap Other email provider (measured from the screenshot) ---"
          $D tap 201 630
          $D dismiss
          sleep 3
          $D shot "$OUT/explore/01-after-other.png"
          xcrun simctl io '${{ steps.sim.outputs.udid }}' screenshot "$OUT/explore/01-device.png"
          $D diff "$OUT/explore/00-device.png" "$OUT/explore/01-device.png"
          echo "--- dialog inventory after first tap ---"
          $D dialogs
          # if the tap was swallowed, try once more after clearing any prompt
          cp /tmp/drive_ui/desktop.png "$OUT/explore/01-desktop.png" 2>/dev/null || true
          $D tap 201 630
          sleep 3
          $D shot "$OUT/explore/01b-after-other-retry.png"
          xcrun simctl io '${{ steps.sim.outputs.udid }}' screenshot "$OUT/explore/01b-device.png"
          $D diff "$OUT/explore/00-device.png" "$OUT/explore/01b-device.png"
          for i in 2 3 4 5; do
            $D swipe 201 720 201 260
            sleep 2
            $D shot "$OUT/explore/0$i-scrolled.png"
            xcrun simctl io '${{ steps.sim.outputs.udid }}' screenshot "$OUT/explore/0$i-device.png"
          done

      # Diagnostic phase: find out whether the app stops handling touches after
      # the email is entered (a main-thread hang) or whether the clicks never
      # arrive. Each scenario ends by tapping the back arrow: if the app is
      # alive that always changes the screen.
      - name: Probe touch handling
        if: github.event.inputs.phase == 'probe'
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          BID=$(cat "$OUT/bundle-id.txt")
          D="python3 poc/scripts/drive_ui.py"
          E="$OUT/probe"; mkdir -p "$E"

          restart() {
            xcrun simctl terminate "$UDID" "$BID" >/dev/null 2>&1 || true
            sleep 2
            xcrun simctl launch "$UDID" "$BID" >/dev/null
            sleep 10
            $D dismiss >/dev/null 2>&1 || true
            $D focus
          }
          pid_of() { pgrep -f 'FlowCrypt.app/FlowCrypt' | head -1; }

          echo "=== S1: password field first, before any email is typed ==="
          restart
          $D tapnav 201 630
          $D devshot "$E/s1-00-form.png"
          $D tapnav 201 293 0.2
          $D devshot "$E/s1-01-password.png"
          $D tapnav 30 95
          $D devshot "$E/s1-02-back.png"

          echo "=== S2: email first, then the password field ==="
          restart
          $D tapnav 201 630
          $D field 201 181 "$POC_EMAIL"
          $D devshot "$E/s2-01-email.png"
          sleep 5
          $D tapnav 201 293 0.2
          $D devshot "$E/s2-02-password.png"
          $D tapnav 30 95
          $D devshot "$E/s2-03-back.png"

          echo "=== S3: is the app process still alive, and where is its main thread? ==="
          P=$(pid_of); echo "pid=$P"
          if [ -n "$P" ]; then
            ps -o pid,stat,%cpu,etime,command -p "$P" | tail -2
            sample "$P" 3 -file "$E/main-thread-sample.txt" >/dev/null 2>&1 || true
            sed -n '/Thread_.*DispatchQueue_1/,/^$/p' "$E/main-thread-sample.txt" | head -45 || true
          fi

      - name: Record the IMAP sign-in
        if: github.event.inputs.phase == 'login'
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          BID=$(cat "$OUT/bundle-id.txt")
          D="python3 poc/scripts/drive_ui.py"
          E="$OUT/login"; mkdir -p "$E"

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$OUT/demo-1-login.mp4" &
          VID=$!
          sleep 3
          xcrun simctl launch --console-pty "$UDID" "$BID" 2>&1 \
            | python3 poc/scripts/stamp.py > "$OUT/console-old-login.log" &
          CONSOLE=$!
          sleep 14
          $D dismiss
          $D focus
          $D devshot "$E/00-signin.png"

          echo "--- open the manual IMAP form ---"
          $D tapnav 201 630
          $D devshot "$E/01-setup.png"

          # the on-screen keyboard would push the lower rows around, and the
          # paste still works through the hardware keyboard
          $D hidekbd

          echo "--- email (servers auto-fill from the domain) ---"
          $D field 201 181 "$POC_EMAIL"
          $D devshot "$E/02-email.png"

          echo "--- password ---"
          $D field 201 293 "$POC_PASSWORD"
          $D devshot "$E/03-password.png"

          # the old build fills server + security type but leaves both ports blank
          echo "--- IMAP port 993 ---"
          $D field 201 458 993
          echo "--- SMTP port 465 ---"
          $D field 201 679 465
          $D devshot "$E/04-filled.png"

          echo "--- Connect (found by colour, not by a stale coordinate) ---"
          $D tapgreen 560
          sleep 4
          $D devshot "$E/05-after-connect.png"
          sleep 18
          $D devshot "$E/06-result.png"

          kill -INT $VID 2>/dev/null; sleep 3
          kill $CONSOLE 2>/dev/null || true
          echo "=== mock IMAP so far ==="
          cat /tmp/mock_mail/imap.log 2>/dev/null | tail -12 || true

      - name: Collect evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          cp /tmp/mock_mail/*.log "$OUT/" 2>/dev/null || true
          echo "=== mock IMAP ==="; cat /tmp/mock_mail/imap.log 2>/dev/null || true
          echo "=== mock SMTP ==="; cat /tmp/mock_mail/smtp.log 2>/dev/null || true
          echo "=== app console ==="; grep -aiE "imap|login|auth|mailcore" "$OUT/console-old-login.log" 2>/dev/null | head -20 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-record-${{ github.run_id }}
          path: ${{ env.OUT }}
