name: wda-probe

# Fast diagnostic (no app build, ~5 min): why can't WebDriverAgent start on a
# GitHub-hosted macOS runner?
#
# Observed on macos-15-intel / Xcode 26.3:
#   error: lstat(.../iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib):
#          No such file or directory  (in target 'WebDriverAgentRunner')
#   ** TEST BUILD FAILED **
#   Failed to get bundle ID from .../WebDriverAgentRunner-Runner.app
#
# This probe reports the exact Xcode/Appium/WDA versions, locates the dylib
# anywhere inside the Xcode bundle, repairs the path with a symlink when it
# exists, and then retries a real session against MobileSafari.app.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner label'
        default: 'macos-15-intel'
      driver_version:
        description: 'xcuitest driver version (empty = latest)'
        default: ''

jobs:
  probe:
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          PICKED=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            [ -x "$app/Contents/Developer/usr/bin/xcodebuild" ] && PICKED="$app" && break
          done
          [ -n "$PICKED" ] && sudo xcode-select -s "$PICKED"
          echo "PICKED=$PICKED" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "--- runtimes ---"
          xcrun simctl list runtimes

      - name: Install Appium + xcuitest driver
        run: |
          set -euo pipefail
          npm install -g appium@latest
          echo "appium: $(appium --version)"
          DV='${{ github.event.inputs.driver_version }}'
          if [ -n "$DV" ]; then appium driver install xcuitest@"$DV"; else appium driver install xcuitest; fi
          echo "--- installed driver ---"
          appium driver list --installed 2>&1 | head -20
          WDA_DIR="$HOME/.appium/node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent"
          echo "WDA_DIR=$WDA_DIR" >> "$GITHUB_ENV"
          if [ -f "$WDA_DIR/package.json" ]; then
            echo "appium-webdriveragent: $(python3 -c "import json;print(json.load(open('$WDA_DIR/package.json'))['version'])")"
          fi
          if [ -f "$HOME/.appium/node_modules/appium-xcuitest-driver/package.json" ]; then
            echo "appium-xcuitest-driver: $(python3 -c "import json;print(json.load(open('$HOME/.appium/node_modules/appium-xcuitest-driver/package.json'))['version'])")"
          fi

      - name: Hunt for lib_TestingInterop.dylib inside the Xcode bundle
        run: |
          set -uo pipefail
          XC="$(dirname "$(dirname "$(xcode-select -p)")")"
          echo "Xcode bundle: $XC"
          echo "--- expected path ---"
          EXPECTED="$XC/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          ls -la "$EXPECTED" 2>&1 || echo "MISSING: $EXPECTED"
          echo "--- where does it actually live? ---"
          # Targeted, not a full-tree walk: only a handful of Developer/usr/lib dirs.
          for d in \
            "$XC/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib" \
            "$XC/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/Library" \
            "$XC/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/Library/PrivateFrameworks" \
            "$XC/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib" \
            "$XC/Contents/Developer/usr/lib" ; do
            [ -d "$d" ] && find "$d" -maxdepth 3 -name "lib_TestingInterop*" 2>/dev/null
          done
          echo "--- any copy under the two simulator/device platforms (shallow) ---"
          find "$XC/Contents/Developer/Platforms/iPhoneSimulator.platform" -maxdepth 6 -name "lib_TestingInterop*" 2>/dev/null | head -5
          find "$XC/Contents/Developer/Platforms/iPhoneOS.platform" -maxdepth 6 -name "lib_TestingInterop*" 2>/dev/null | head -5
          echo "--- XCTest framework contents (sanity) ---"
          ls "$XC/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/XCTest.framework" 2>/dev/null | head

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in d.items():
              for dev in devs:
                  if "iPhone" in dev["name"] and dev.get("isAvailable"):
                      print(dev["udid"]); raise SystemExit
          raise SystemExit("no iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "device: $(xcrun simctl list devices | grep "$UDID")"

      - name: Repair the dylib path if the file exists somewhere else
        id: repair
        run: |
          set -uo pipefail
          XC="$(dirname "$(dirname "$(xcode-select -p)")")"
          LIBDIR="$XC/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib"
          TARGET="$LIBDIR/lib_TestingInterop.dylib"
          SRC=$(find "$XC/Contents/Developer" -maxdepth 8 -name "lib_TestingInterop*.dylib" 2>/dev/null | head -1)

          # xcodebuild resolved the missing path through a *different* Xcode
          # bundle name than xcode-select reports (Xcode_26.3 vs Xcode_26.3.0),
          # so patching only the selected bundle left the build failing. Put the
          # dylib in every Xcode bundle that exists on the image.
          fixed=""
          for app in /Applications/Xcode*.app "$XC"; do
            lib="$app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib"
            [ -d "$app/Contents/Developer" ] || continue
            [ -e "$lib/lib_TestingInterop.dylib" ] && { fixed="$fixed $app(already)"; continue; }
            [ -n "$SRC" ] || continue
            sudo mkdir -p "$lib"
            sudo ln -sf "$SRC" "$lib/lib_TestingInterop.dylib"
            fixed="$fixed $app"
          done
          echo "source: ${SRC:-NOT FOUND}"
          echo "patched:${fixed:- nothing}"
          [ -n "$SRC" ] && echo "REPAIR=patched" >> "$GITHUB_OUTPUT" || echo "REPAIR=impossible" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Build WDA for testing the way Appium does
        id: buildwda
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          mkdir -p out
          cd "$WDA_DIR"
          xcodebuild build-for-testing test-without-building \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "id=$UDID" \
            GCC_TREAT_WARNINGS_AS_ERRORS=0 \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/wda-build.log | tail -5
          echo "--- errors only ---"
          grep -E "error:|TEST BUILD FAILED|TEST BUILD SUCCEEDED" /tmp/wda-build.log | head -20

      - name: Start Appium and try a real session
        id: session
        continue-on-error: true
        run: |
          set -uo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          ROOT=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          rts=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable")]
          ios=[r for r in rts if r.get("platform")=="iOS"] or rts
          print(ios[0].get("runtimeRoot") or (ios[0]["bundlePath"]+"/Contents/Resources/RuntimeRoot"))')
          APP="$ROOT/Applications/MobileSafari.app"
          # pin xcodebuild to the selected toolchain: Appium otherwise guesses a
          # bundle name and hits the path that does not exist
          export DEVELOPER_DIR="$(xcode-select -p)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          nohup appium --port 4723 --log-level info > out/appium.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done
          cat > out/session.json <<JSON
          {"capabilities":{"alwaysMatch":{
            "platformName":"iOS",
            "appium:automationName":"XCUITest",
            "appium:udid":"$UDID",
            "appium:deviceName":"iPhone",
            "appium:app":"$APP",
            "appium:noReset":true,
            "appium:showXcodeLog":true,
            "appium:wdaLaunchTimeout":420000,
            "appium:wdaConnectionTimeout":420000,
            "appium:newCommandTimeout":600
          }}}
          JSON
          curl -sS -X POST http://127.0.0.1:4723/session \
            -H 'Content-Type: application/json' --max-time 900 \
            --data @out/session.json -o out/session-response.json -w 'http=%{http_code}\n' || echo "curl failed"
          python3 - <<'PY'
          import json
          try:
              r = json.load(open('out/session-response.json'))
          except Exception as e:
              print('unparseable:', e, open('out/session-response.json').read()[:400]); raise SystemExit(0)
          v = r.get('value', {})
          sid = r.get('sessionId') or (v.get('sessionId') if isinstance(v, dict) else None)
          if sid:
              print('WDA_OK sessionId=', sid)
          else:
              print('WDA_FAIL', json.dumps(v)[:1500])
          PY

      - name: Summarise
        if: always()
        run: |
          set -uo pipefail
          echo "repair: ${{ steps.repair.outputs.REPAIR }}"
          echo "--- wda build errors ---"
          grep -E "error:|TEST BUILD FAILED|TEST BUILD SUCCEEDED" /tmp/wda-build.log 2>/dev/null | head -10 || true
          echo "--- appium: first real failure ---"
          grep -nE "error:|ECONNREFUSED 127.0.0.1:8100|Failed to get bundle ID|WDA is not listening|Unable to launch" out/appium.log 2>/dev/null | head -12 || true

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wda-probe-${{ github.run_id }}
          path: |
            out
            /tmp/wda-build.log
